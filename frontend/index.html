<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Fitness Coach</title>

  <!-- Build-free frontend: this machine's Device Guard policy blocks native binaries
       (esbuild/rolldown/mongod all fail identically), so there is no Vite/webpack here.
       React + Babel run entirely inside the browser instead. -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js" crossorigin></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Applied before first paint (not in the React tree) so the page never flashes the
    // wrong theme on load. Mirrors what the ThemeProvider in lib.js does on toggle.
    (function () {
      const saved = localStorage.getItem('theme');
      const wantsDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', wantsDark);
    })();
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Rich premium palette: blush pink to violet with cool navy neutrals.
            brand: {
              50: '#fff5fb', 100: '#fce7f3', 200: '#f9cfe7', 300: '#f7b3d7', 400: '#f78ac2',
              500: '#f25aa8', 600: '#df3f95', 700: '#bc2f7c', 800: '#8f245f', 900: '#641a43',
            },
            accent: {
              50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 400: '#2dd4bf',
              500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a',
            },
            slate: {
              50: '#f8fafc', 100: '#eef3ff', 200: '#dfe7f7', 300: '#c1cee8', 400: '#9aa7c9',
              500: '#6c7aa8', 600: '#4d5f8d', 700: '#39496f', 800: '#1f2b4d', 900: '#101a36', 950: '#0a1329',
            },
          },
          keyframes: {
            fadeUp: { '0%': { opacity: 0, transform: 'translateY(10px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
            fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
            popIn: { '0%': { opacity: 0, transform: 'scale(0.92)' }, '100%': { opacity: 1, transform: 'scale(1)' } },
            slideInRight: { '0%': { opacity: 0, transform: 'translateX(16px)' }, '100%': { opacity: 1, transform: 'translateX(0)' } },
            slideInUp: { '0%': { opacity: 0, transform: 'translateY(14px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
            shimmer: { '0%': { backgroundPosition: '-400px 0' }, '100%': { backgroundPosition: '400px 0' } },
            gradientShift: { '0%,100%': { backgroundPosition: '0% 50%' }, '50%': { backgroundPosition: '100% 50%' } },
            pulseGlow: { '0%,100%': { boxShadow: '0 0 0 0 rgba(255,90,95,0.45)' }, '50%': { boxShadow: '0 0 0 8px rgba(255,90,95,0)' } },
            drawLine: { '0%': { strokeDashoffset: 1000 }, '100%': { strokeDashoffset: 0 } },
            bounceSm: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-3px)' } },
          },
          animation: {
            'fade-up': 'fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both',
            'fade-in': 'fadeIn 0.4s ease both',
            'pop-in': 'popIn 0.35s cubic-bezier(0.16,1,0.3,1) both',
            'slide-in-right': 'slideInRight 0.35s cubic-bezier(0.16,1,0.3,1) both',
            'slide-in-up': 'slideInUp 0.4s cubic-bezier(0.16,1,0.3,1) both',
            shimmer: 'shimmer 1.6s infinite linear',
            'gradient-shift': 'gradientShift 8s ease infinite',
            'pulse-glow': 'pulseGlow 2.2s cubic-bezier(0.4,0,0.6,1) infinite',
            'draw-line': 'drawLine 1.2s cubic-bezier(0.16,1,0.3,1) both',
            'bounce-sm': 'bounceSm 0.6s ease-in-out infinite',
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --brand-1: #fff5fb;
      --brand-2: #f9cfe7;
      --brand-3: #f25aa8;
      --brand-4: #df3f95;
      --brand-5: #101a36;
      --surface-1: rgba(255, 255, 255, 0.78);
      --surface-2: rgba(249, 250, 255, 0.9);
      --surface-3: rgba(19, 29, 52, 0.76);
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top left, #fff7fb 0%, #eef4ff 28%, #edfdf9 100%);
      color: #101a36;
    }
    .dark body {
      background: radial-gradient(circle at top left, #0f172a 0%, #101a36 32%, #070d1a 100%);
      color: #e2e8f0;
    }
    #root { min-height: 100vh; }

    .bg-gradient-animated {
      background: linear-gradient(135deg, #fff5fb 0%, #eef4ff 25%, #ecfeff 50%, #fff3d8 100%);
      background-size: 200% 200%;
    }
    .dark .bg-gradient-animated {
      background: linear-gradient(135deg, #0f172a 0%, #111827 30%, #101a36 60%, #1c233e 100%);
      background-size: 200% 200%;
    }
    .shimmer-bg {
      background-color: #edf3ff;
      background-image: linear-gradient(90deg, transparent 0px, rgba(255,255,255,0.9) 40px, transparent 80px);
      background-size: 800px 100%;
      border: 1px solid #dfe7f7;
    }
    .dark .shimmer-bg {
      background-color: #1f2b4d;
      background-image: linear-gradient(90deg, transparent 0px, rgba(255,255,255,0.12) 40px, transparent 80px);
      border-color: #39496f;
    }

    .glass-light {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 12px 40px rgba(16, 26, 54, 0.08);
    }
    .dark .glass-light {
      background: rgba(16, 26, 54, 0.72);
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 14px 42px rgba(2, 6, 23, 0.45);
    }
    .glass-dark {
      background: rgba(9, 14, 30, 0.8);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 18px 44px rgba(2, 6, 23, 0.45);
    }
    .auth-shell {
      position: relative;
      overflow: hidden;
    }
    .auth-shell::before,
    .auth-shell::after {
      content: "";
      position: absolute;
      border-radius: 9999px;
      filter: blur(18px);
      opacity: 0.72;
      pointer-events: none;
    }
    .auth-shell::before {
      width: 18rem;
      height: 18rem;
      right: -5rem;
      top: -4rem;
      background: rgba(242, 90, 168, 0.2);
    }
    .auth-shell::after {
      width: 16rem;
      height: 16rem;
      left: -4rem;
      bottom: -5rem;
      background: rgba(45, 212, 191, 0.2);
    }
    .auth-card {
      position: relative;
      z-index: 1;
      background: linear-gradient(180deg, rgba(255,255,255,0.86), rgba(255,255,255,0.76));
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.14);
    }
    .dark .auth-card {
      background: linear-gradient(180deg, rgba(16,26,54,0.82), rgba(18,25,49,0.74));
      border-color: rgba(255,255,255,0.08);
      box-shadow: 0 28px 64px rgba(2, 6, 23, 0.4);
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #d9dff7, #b9c5eb); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #bfd0ff, #9caee6); }
    .dark ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #39496f, #1f2b4d); }
    .dark ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #4d5f8d, #2f3d63); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950">
  <div id="root"></div>

  <!-- ?v= cache-busts these on every deploy — plain <script src> with no build step
       means browsers will otherwise keep serving a stale cached copy after edits. -->
  <script type="text/babel" data-presets="react" src="/js/lib.js?v=6"></script>
  <script type="text/babel" data-presets="react" src="/js/userPages.js?v=6"></script>
  <script type="text/babel" data-presets="react" src="/js/adminPages.js?v=6"></script>
  <script type="text/babel" data-presets="react" src="/js/main.js?v=6"></script>
</body>
</html>
